name: Jan's Quality Checks and Build

on:
  push:
    branches:
      - main
      - master
      - jans-development
  pull_request:
    branches:
      - main
      - master
      - jans-development
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Format, test and build Jan's
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          submodules: false
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Initialize submodules using GitHub mirror for FFmpeg
        run: |
          git config --global url."https://github.com/FFmpeg/FFmpeg.git".insteadOf "https://git.ffmpeg.org/ffmpeg.git"
          git submodule sync --recursive
          git submodule update --init --recursive

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android build components
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-37.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"

      - name: Fix Android 37 SDK directory name for Gradle
        run: |
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Apply repository formatting
        run: ./gradlew --no-daemon spotlessApply

      - name: Commit formatting changes on branch pushes
        if: github.event_name == 'push' && github.ref == 'refs/heads/jans-development'
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Apply Kotlin and C++ formatting"
            git push
          fi

      - name: Verify formatting
        run: ./gradlew --no-daemon spotlessCheck

      - name: Run Musikr unit tests
        run: ./gradlew --no-daemon :musikr:test

      - name: Build debug APK
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Jans-validated-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
