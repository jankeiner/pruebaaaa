name: Jan's Android Build

on:
  push:
    branches:
      - main
      - master
      - jans-development
  pull_request:
    branches:
      - main
      - master
      - jans-development
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out source and pinned submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android build components
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-37.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"

      - name: Verify required submodules are present
        run: |
          test -f media/build-logic-settings/settings.gradle.kts || test -f media/build-logic-settings/build.gradle.kts
          test -f musikr/src/main/cpp/taglib/CMakeLists.txt

      - name: Fix Android 37 SDK directory name for Gradle
        run: |
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Jans-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
