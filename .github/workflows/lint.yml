name: Jan's Quality Checks

on:
  push:
    branches:
      - main
      - master
      - jans-development
  pull_request:
    branches:
      - main
      - master
      - jans-development
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Formatting and Musikr tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out source and pinned submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android build components
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-37" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Check Kotlin and C++ formatting
        run: ./gradlew --no-daemon spotlessCheck

      - name: Run Musikr unit tests
        run: ./gradlew --no-daemon :musikr:test
